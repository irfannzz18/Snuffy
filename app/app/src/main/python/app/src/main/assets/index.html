<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f2">
<title>Soundify</title>
<style>
:root{
  --bg:#f2f2f2; --text:#3a3a3a; --muted:#8a8a8a;
  --dark:#d4d4d4; --light:#ffffff; --accent:#3a3a3a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{height:100%}
body{
  font-family:system-ui,Roboto,Arial,sans-serif;color:var(--text);background:#e6e6e6;
  display:flex;justify-content:center;align-items:center;overflow:hidden;
}

/* phone container: full screen on Android, phone-sized frame on desktop */
.app{
  position:relative;width:100%;max-width:430px;height:100vh;height:100dvh;background:var(--bg);
  overflow:hidden;display:flex;flex-direction:column;
}
@media(min-width:600px){
  .app{
    width:390px;height:844px;border-radius:44px;border:10px solid var(--bg);
    box-shadow:12px 12px 30px var(--dark),-12px -12px 30px var(--light);
  }
}

.screen{flex:1;overflow-y:auto;padding:12px 14px 100px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}

.top{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 12px}
.brand{font-size:21px;font-weight:800;letter-spacing:.3px}
.brand span{color:var(--text)}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--bg);
  box-shadow:4px 4px 8px var(--dark),-4px -4px 8px var(--light)}

/* neumorphic raised surface */
.neu{background:var(--bg);border-radius:26px;padding:16px;box-shadow:8px 8px 16px var(--dark),-8px -8px 16px var(--light)}
/* glassmorphic panel (white glass) */
.glass{
  background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.8);border-radius:24px;padding:14px;
  backdrop-filter:blur(18px) saturate(120%);-webkit-backdrop-filter:blur(18px) saturate(120%);
  box-shadow:0 8px 32px rgba(0,0,0,.06);
}
.inset{background:var(--bg);border-radius:16px;box-shadow:inset 5px 5px 10px var(--dark),inset -5px -5px 10px var(--light)}
.muted{color:var(--muted);font-size:13px}
h2{font-size:15px;margin-bottom:10px;color:var(--text)}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px 12px}
.head h2{margin:0}
.page-title{font-size:20px;font-weight:800}
[hidden]{display:none!important}

.view{display:none;flex-direction:column;gap:14px}
.view.active{display:flex}

button{
  font:inherit;color:var(--text);background:var(--bg);border:0;border-radius:16px;padding:11px 14px;cursor:pointer;
  box-shadow:6px 6px 12px var(--dark),-6px -6px 12px var(--light);transition:box-shadow .15s,transform .05s;
  outline:none;-webkit-user-select:none;user-select:none;
}
button::-moz-focus-inner{border:0}
button:active{box-shadow:inset 3px 3px 6px var(--dark),inset -3px -3px 6px var(--light);transform:scale(.97)}
button.on{color:#000;font-weight:700}
button.round{width:46px;height:46px;border-radius:50%;padding:0;font-size:16px}
button.big{width:62px;height:62px;border-radius:50%;padding:0;font-size:20px;color:var(--text);background:var(--bg)}
button.small{padding:8px 12px;border-radius:14px;font-size:12px}
.row{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}
.btn-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn-row button{padding:9px 12px;font-size:12px}

/* now playing */
.now{text-align:center}
.now .title{
  font-size:18px;font-weight:700;max-width:100%;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  overflow-wrap:anywhere;line-height:1.3;
}
.now .artist{margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{margin-top:4px;font-size:13px}

/* black disc that rotates while playing */
.disc{
  width:160px;height:160px;margin:14px auto;border-radius:50%;position:relative;
  background:radial-gradient(circle,#2a2a2a 0 16%,#111 17% 62%,#000 63%);
  box-shadow:8px 8px 16px var(--dark),-8px -8px 16px var(--light);
}
.disc::after{
  content:"";position:absolute;top:50%;left:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;
  background:#ffffff;box-shadow:inset 2px 2px 4px var(--dark),inset -2px -2px 4px var(--light);
}
.disc.spin{animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.progress{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:11px;color:var(--muted)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:8px;background:var(--bg);
  box-shadow:inset 3px 3px 6px var(--dark),inset -3px -3px 6px var(--light);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#ffffff;box-shadow:2px 2px 5px var(--dark)}
.volume{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:var(--muted)}
.volume input{flex:1}
.actions-row{display:flex;justify-content:center;gap:8px;margin-top:12px}

/* search */
.search{display:flex;gap:8px;align-items:center;padding:4px}
.search input{flex:1;border:0;outline:0;background:transparent;color:var(--text);font:inherit;padding:11px 12px;min-width:0}
.search input::placeholder{color:var(--muted)}
.search button{padding:9px 14px;flex-shrink:0;border-radius:14px}

/* lists: titles wrap inside the box, max 2 lines */
.list{display:grid;gap:8px;padding:2px}
.item{display:flex;align-items:center;gap:10px;padding:7px;border-radius:16px;background:rgba(255,255,255,.5);min-width:0}
.item.active{background:#ffffff;box-shadow:inset 2px 2px 4px var(--dark),inset -2px -2px 4px var(--light)}
.item img,.item .ph{width:42px;height:42px;border-radius:12px;object-fit:cover;flex-shrink:0;box-shadow:3px 3px 6px var(--dark)}
.item .ph{background:#ffffff}
.item .meta{flex:1;min-width:0;max-width:100%}
.item .t{
  font-weight:600;font-size:13px;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  overflow-wrap:anywhere;word-break:break-word;
}
.item .a{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.acts{display:flex;gap:5px;flex-shrink:0}
.acts button{width:31px;height:31px;padding:0;border-radius:50%;font-size:11px}

/* album cards (add-to-album sheet) */
.album{display:flex;align-items:center;gap:10px;padding:9px;border-radius:18px;background:rgba(255,255,255,.5);cursor:pointer;min-width:0}
.album .cover-a{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:16px;color:var(--text);
  background:#ffffff;box-shadow:3px 3px 6px var(--dark);flex-shrink:0}
.album .meta{flex:1;min-width:0}
.album .t{
  font-weight:700;font-size:14px;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;
}
.album .a{font-size:11px;color:var(--muted)}

/* bottom navigation (white glass), two tabs only */
.nav{
  position:absolute;bottom:0;left:0;right:0;z-index:5;
  display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 14px 12px;
  background:rgba(255,255,255,.6);backdrop-filter:blur(18px) saturate(120%);-webkit-backdrop-filter:blur(18px) saturate(120%);
  border-top:1px solid rgba(255,255,255,.9);box-shadow:0 -6px 24px rgba(0,0,0,.06);
}
.tab{background:none;box-shadow:none;border-radius:16px;padding:7px 0;font-size:11px;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:2px}
.tab:active{box-shadow:none;transform:scale(.96)}
.tab .i{font-size:17px}
.tab.on{color:var(--text);font-weight:700;background:var(--bg);box-shadow:inset 2px 2px 4px var(--dark),inset -2px -2px 4px var(--light)}

/* add-to-album sheet */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.25);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{
  width:100%;max-height:70%;padding:16px;border-radius:26px 26px 0 0;display:flex;flex-direction:column;gap:10px;
  background:rgba(255,255,255,.85);border:1px solid #ffffff;
  backdrop-filter:blur(22px) saturate(120%);-webkit-backdrop-filter:blur(22px) saturate(120%);
  box-shadow:0 -8px 32px rgba(0,0,0,.12);
}
.sheet-list{display:grid;gap:8px;overflow:auto;max-height:45vh}
.sheet-actions{display:flex;gap:8px}
.sheet-actions button{flex:1}

/* toast (white glass) */
#toast{position:absolute;left:50%;bottom:84px;transform:translate(-50%,200%);transition:transform .3s;z-index:20;
  background:rgba(255,255,255,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid #ffffff;padding:10px 16px;border-radius:18px;font-size:12px;max-width:88%;text-align:center;
  box-shadow:0 8px 24px rgba(0,0,0,.12);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app">
  <div class="screen" id="screen">
    <header class="top">
      <div class="brand">♫ <span>Soundify</span></div>
      <div class="avatar">I</div>
    </header>

    <!-- HOME -->
    <section class="view active" id="view-home">
      <div class="neu now">
        <div class="title" id="title">No Track</div>
        <div class="artist muted" id="artist"></div>
        <div class="status" id="status">Stopped</div>
        <div class="disc" id="disc"></div>

        <div class="progress">
          <span id="cur">0:00</span>
          <input type="range" id="progress" min="0" max="100" value="0" aria-label="Track progress">
          <span id="dur">0:00</span>
        </div>

        <div class="row" style="margin-top:10px">
          <button class="round" id="shuffleBtn" data-act="ctrl" data-c="shuffle" title="Shuffle">⤨</button>
          <button class="round" data-act="ctrl" data-c="prev" title="Previous">⏮</button>
          <button class="big" id="playBtn" data-act="ctrl" data-c="toggle" title="Play / Pause">▶</button>
          <button class="round" data-act="ctrl" data-c="next" title="Next">⏭</button>
          <button class="round" id="repeatBtn" data-act="ctrl" data-c="repeat" title="Repeat">↻</button>
        </div>

        <div class="actions-row">
          <button class="small" id="likeBtn" data-act="likenow">♡ Like</button>
          <button class="small" data-act="addnow">+ Add to album</button>
        </div>

        <div class="btn-row">
          <button data-act="load" data-file="songs.txt">Shuffle songs.txt</button>
          <button data-act="load" data-file="song.txt">song.txt</button>
          <button data-act="ctrl" data-c="stop">Stop</button>
        </div>

        <div class="volume">
          <span>🔈</span><input type="range" id="volume" min="0" max="100" value="70" aria-label="Volume"><span>🔊</span>
        </div>
      </div>

      <div class="neu">
        <h2>YouTube</h2>
        <div class="search inset">
          <input id="q" placeholder="Search songs or artists…" autocomplete="off">
          <button id="goBtn">Go</button>
        </div>
      </div>

      <div class="glass" id="resultsPanel" hidden>
        <h2>Results</h2>
        <div class="list" id="results"></div>
      </div>

      <div class="glass">
        <h2>Queue</h2>
        <div class="list" id="queue"><div class="muted">Nothing queued yet.</div></div>
      </div>
    </section>

    <!-- LIKED -->
    <section class="view" id="view-liked">
      <div class="head">
        <div class="page-title">Liked videos</div>
        <span class="muted" id="likedCount"></span>
      </div>
      <div class="row">
        <button class="small" data-act="playall" data-list="liked">▶ Play all</button>
        <button class="small" data-act="playall" data-list="liked" data-shuffle="1">⤨ Shuffle</button>
      </div>
      <div class="glass">
        <div class="list" id="likedBox"></div>
      </div>
    </section>
  </div>

  <!-- bottom navigation: two tabs only -->
  <nav class="nav">
    <button class="tab on" data-act="tab" data-tab="home"><span class="i">⌂</span>Home</button>
    <button class="tab" data-act="tab" data-tab="liked"><span class="i">♥</span>Liked</button>
  </nav>

  <!-- add to album sheet -->
  <div class="overlay" id="sheet" hidden>
    <div class="sheet">
      <h2>Add to album</h2>
      <div class="sheet-list" id="sheetList"></div>
      <div class="sheet-actions">
        <button data-act="sheetnew">+ New album</button>
        <button data-act="closesheet">Cancel</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>
</div>

<script>
/* APK bridge: routes the old /api calls to the Android app */
(function () {
  const realFetch = window.fetch.bind(window);
  const json = obj => new Response(JSON.stringify(obj), { headers: { "Content-Type": "application/json" } });
  window.fetch = function (url, opts) {
    const u = String(url);
    if (!u.startsWith("/api/")) return realFetch(url, opts);
    const [path, qs] = u.split("?");
    const p = new URLSearchParams(qs || "");
    let body = {};
    try { body = opts && typeof opts.body === "string" ? JSON.parse(opts.body) : {}; } catch (e) {}
    switch (path) {
      case "/api/status":
        return Promise.resolve(json(JSON.parse(AndroidBridge.status())));
      case "/api/control":
        AndroidBridge.control(body.action || "", String(body.value ?? ""));
        return Promise.resolve(json({ ok: true }));
      case "/api/queue":
        AndroidBridge.setQueue(JSON.stringify(body.items || []), body.index || 0);
        return Promise.resolve(json({ ok: true }));
      case "/api/load":
        return Promise.resolve(json(JSON.parse(AndroidBridge.load(p.get("file") || ""))));
      case "/api/search":
        return new Promise(resolve => {
          window.__searchRes = list => resolve(json({ results: list }));
          AndroidBridge.search(p.get("q") || "");
        });
      default:
        return Promise.resolve(json({ error: "Not available in the app" }));
    }
  };
})();
</script>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; };
const post = (url, body) => fetch(url, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)}).then(r => r.json());

const LS = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

let st = {}, seeking = false, queueSig = "";
let sheetItem = null, lastResults = [];
let albums = LS.get("soundify.albums", []);
let liked = LS.get("soundify.liked", []);
let currentQueue = LS.get("soundify.queue", []);

const clean = i => ({ id: i.id || null, title: i.title || "Unknown", artist: i.artist || "", thumb: i.thumb || "" });
const keyOf = i => i.id ? `v:${i.id}` : `t:${i.title}|${i.artist || ""}`;
const isLiked = i => liked.some(x => keyOf(x) === keyOf(i));
const saveAll = () => { LS.set("soundify.albums", albums); LS.set("soundify.liked", liked); LS.set("soundify.queue", currentQueue); };

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove("show"), 2200);
}

const queueItems = () => currentQueue.length ? currentQueue : (st.queue || []);

function currentItem() {
  const t = st.track;
  if (!t) return null;
  const c = currentQueue[st.index];
  if (c && c.title === t.title) return c;
  return clean({ title: t.title, artist: t.artist, thumb: t.thumb });
}

function getList(name) {
  if (name === "search") return lastResults;
  if (name === "liked") return liked;
  if (name === "queue") return queueItems();
  return [];
}

function thumbHTML(i) {
  return i.thumb ? `<img src="${esc(i.thumb)}" alt="" loading="lazy">` : `<div class="ph"></div>`;
}

/* showAlbum=false hides the + (add to album) button, used on Liked */
function row(item, list, idx, active = false, showAlbum = true) {
  const on = isLiked(item);
  return `<div class="item ${active ? "active" : ""}">
    ${thumbHTML(item)}
    <div class="meta"><div class="t">${esc(item.title)}</div><div class="a">${esc(item.artist)}</div></div>
    <div class="acts">
      <button data-act="play" data-list="${list}" data-i="${idx}" title="Play">▶</button>
      <button class="${on ? "on" : ""}" data-act="like" data-list="${list}" data-i="${idx}" title="Like">${on ? "♥" : "♡"}</button>
      ${showAlbum ? `<button data-act="addalbum" data-list="${list}" data-i="${idx}" title="Add to album">+</button>` : ""}
    </div>
  </div>`;
}

/* ---------- playback ---------- */
async function playList(items, index = 0) {
  if (!items.length) return toast("Nothing to play");
  currentQueue = items.map(clean);
  saveAll();
  await post("/api/queue", { items: currentQueue, index });
  refresh();
}

async function control(action, value) {
  await post("/api/control", { action, value });
  refresh();
}

async function loadFile(name) {
  const r = await fetch("/api/load?file=" + encodeURIComponent(name)).then(r => r.json());
  if (!r.error) { currentQueue = []; saveAll(); }
  toast(r.error ? r.error : `Loaded ${r.count} songs from ${name}`);
  refresh();
}

/* ---------- likes ---------- */
function toggleLike(item) {
  if (!item) return;
  const k = keyOf(item);
  liked = isLiked(item) ? liked.filter(x => keyOf(x) !== k) : [...liked, clean(item)];
  saveAll();
  renderAll();
}

/* ---------- albums (created and filled from the + sheet) ---------- */
function createAlbum(fromSheet) {
  const name = prompt("Album name:");
  if (!name || !name.trim()) return;
  const a = { id: Date.now().toString(36), name: name.trim(), tracks: [] };
  albums.push(a);
  saveAll();
  if (fromSheet && sheetItem) pickAlbum(a.id);
  else renderSheet();
}

function openSheet(item) {
  sheetItem = clean(item);
  renderSheet();
  $("sheet").hidden = false;
}
function closeSheet() { $("sheet").hidden = true; sheetItem = null; }

function renderSheet() {
  $("sheetList").innerHTML = albums.length
    ? albums.map(a => `<div class="album" data-act="pick" data-id="${esc(a.id)}">
        <div class="cover-a">♫</div>
        <div class="meta"><div class="t">${esc(a.name)}</div><div class="a">${a.tracks.length} songs</div></div>
      </div>`).join("")
    : '<div class="muted">No albums yet. Create one below.</div>';
}

function pickAlbum(id) {
  const a = albums.find(x => x.id === id);
  if (!a || !sheetItem) return;
  if (!a.tracks.some(t => keyOf(t) === keyOf(sheetItem))) a.tracks.push(sheetItem);
  saveAll();
  closeSheet();
  toast(`Added to ${a.name}`);
}

/* ---------- rendering ---------- */
function render() {
  const t = st.track || {};
  $("title").textContent = t.title || "No Track";
  $("artist").textContent = t.artist || "";

  const playing = st.state === "playing" && !st.paused;
  let label = "Stopped";
  if (st.state === "loading") label = "Loading…";
  else if (st.state === "error") label = st.error || "Error";
  else if (st.state === "playing") label = st.paused ? "Paused" : "Playing";
  $("status").textContent = label;

  $("disc").classList.toggle("spin", playing);
  $("playBtn").textContent = (playing || st.state === "loading") ? "❚❚" : "▶";
  $("shuffleBtn").classList.toggle("on", !!st.shuffle);
  $("repeatBtn").classList.toggle("on", !!st.repeat);

  if (!seeking) {
    $("progress").max = st.duration || 100;
    $("progress").value = st.position || 0;
    $("cur").textContent = fmt(st.position);
    $("dur").textContent = fmt(st.duration);
  }
  if (document.activeElement !== $("volume")) $("volume").value = st.volume ?? 70;

  renderNowLike();
  const sig = `${queueItems().length}:${st.index}:${st.state}:${liked.length}:${t.title || ""}`;
  if (sig !== queueSig) { queueSig = sig; renderQueue(); }
}

function renderNowLike() {
  const ci = currentItem();
  const on = !!ci && isLiked(ci);
  $("likeBtn").textContent = on ? "♥ Liked" : "♡ Like";
  $("likeBtn").classList.toggle("on", on);
}

function renderQueue() {
  const q = queueItems();
  $("queue").innerHTML = q.length
    ? q.map((item, i) => row(item, "queue", i, i === st.index)).join("")
    : '<div class="muted">Nothing queued yet.</div>';
}

function renderSearch() {
  $("resultsPanel").hidden = !lastResults.length && !$("results").dataset.busy;
  $("results").innerHTML = lastResults.length
    ? lastResults.map((r, i) => row(r, "search", i)).join("")
    : "";
}

function renderLiked() {
  $("likedCount").textContent = liked.length ? `${liked.length} songs` : "";
  $("likedBox").innerHTML = liked.length
    ? liked.map((t, i) => row(t, "liked", i, false, false)).join("")
    : '<div class="muted">No liked videos yet. Tap ♡ on any song.</div>';
}

function renderAll() {
  renderNowLike();
  queueSig = "";
  renderQueue();
  renderSearch();
  renderLiked();
  if (!$("sheet").hidden) renderSheet();
}

function setView(name) {
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === "view-" + name));
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.tab === name));
  if (name === "liked") renderLiked();
  $("screen").scrollTo({top: 0, behavior: "smooth"});
}

async function refresh() {
  try {
    st = await fetch("/api/status").then(r => r.json());
    render();
  } catch (e) {}
}

/* ---------- search (on Home only) ---------- */
async function search() {
  const q = $("q").value.trim();
  if (!q) return;
  $("resultsPanel").hidden = false;
  $("results").dataset.busy = "1";
  $("results").innerHTML = '<div class="muted">Searching…</div>';
  try {
    const r = await fetch("/api/search?q=" + encodeURIComponent(q)).then(r => r.json());
    lastResults = r.results || [];
    if (r.error) toast(r.error);
  } catch (e) {
    lastResults = [];
    toast("Search failed");
  }
  delete $("results").dataset.busy;
  renderSearch();
  if (!lastResults.length) { $("results").innerHTML = '<div class="muted">No results.</div>'; }
}

/* ---------- events (single delegated handler) ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act;
  const list = b.dataset.list;
  const i = Number(b.dataset.i);
  const items = list ? getList(list) : null;

  switch (act) {
    case "tab":      setView(b.dataset.tab); break;
    case "ctrl":     control(b.dataset.c); break;
    case "likenow":  toggleLike(currentItem()); break;
    case "addnow":   { const ci = currentItem(); if (ci) openSheet(ci); else toast("Play a song first"); break; }
    case "load":     loadFile(b.dataset.file); break;
    case "play":     playList(items, i); break;
    case "like":     toggleLike(items[i]); break;
    case "addalbum": openSheet(items[i]); break;
    case "pick":     pickAlbum(b.dataset.id); break;
    case "newalbum":
    case "sheetnew": createAlbum(true); break;
    case "closesheet": closeSheet(); break;
    case "playall": {
      let list2 = [...getList(b.dataset.list)];
      if (b.dataset.shuffle) list2.sort(() => Math.random() - 0.5);
      playList(list2, 0);
      break;
    }
  }
});

$("sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeSheet(); });

$("goBtn").onclick = search;
$("q").addEventListener("keydown", e => { if (e.key === "Enter") search(); });

$("volume").addEventListener("input", e => control("volume", e.target.value));

const prog = $("progress");
prog.addEventListener("input", () => { seeking = true; $("cur").textContent = fmt(Number(prog.value)); });
prog.addEventListener("change", () => { seeking = false; control("seek", Number(prog.value)); });

renderAll();
refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
